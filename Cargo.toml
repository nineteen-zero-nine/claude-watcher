[package]
name = "claude-watcher"
version = "0.1.0"
edition = "2021"
description = "Inspect Claude Code hook configuration and what fills a session's context window"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
